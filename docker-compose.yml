# `docker compose up --build` → http://localhost:8080 (gateway), /api/health, /ai/health
# Cổng đổi qua .env: GATEWAY_PORT, POSTGRES_PORT
# Ghim tên project để container/volume mang tên dự án (uls-postgres-1, uls_pgdata...).
# Ghi đè bằng COMPOSE_PROJECT_NAME hoặc `-p` khi chạy từ worktree riêng.
name: uls

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: uls
      POSTGRES_PASSWORD: uls
      POSTGRES_DB: uls
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uls -d uls"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://uls:uls@postgres:5432/uls?schema=public
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      CORS_ORIGINS: http://localhost:${GATEWAY_PORT:-8080}
      AI_SERVICE_URL: http://ai-service:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
      # Thanh toán phạt VNPay: bỏ trống thì tắt tính năng (xem README)
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_URL: ${VNPAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      APP_PUBLIC_URL: ${PUBLIC_SITE_URL:-http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    build: ./ai-service
    environment:
      BACKEND_URL: http://backend:3000/api
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal}
      # Huấn luyện lại khi khởi động; đặt 0 nếu muốn chủ động gọi POST /train
      TRAIN_ON_STARTUP: ${TRAIN_ON_STARTUP:-1}
    depends_on:
      - backend

  frontend:
    build: ./frontend
    environment:
      # Trình duyệt gọi /api cùng origin qua gateway (mặc định trong mã nguồn).
      # Server component gọi thẳng backend trong mạng nội bộ.
      API_URL: http://backend:3000/api
      # Chỉ dùng cho thẻ canonical và sitemap; đổi theo tên miền thật khi triển khai
      NEXT_PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:8080}
    depends_on:
      - backend

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    depends_on:
      - frontend
      - backend
      - ai-service

volumes:
  pgdata:
