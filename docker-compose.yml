# `docker compose up --build` → http://localhost:8080 (gateway), /api/health, /ai/health
# Cổng đổi qua .env: GATEWAY_PORT, POSTGRES_PORT
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: uls
      POSTGRES_PASSWORD: uls
      POSTGRES_DB: uls
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uls -d uls"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://uls:uls@postgres:5432/uls?schema=public
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      CORS_ORIGINS: http://localhost:${GATEWAY_PORT:-8080}
      AI_SERVICE_URL: http://ai-service:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    build: ./ai-service
    environment:
      BACKEND_URL: http://backend:3000/api
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal}

  frontend:
    build: ./frontend

  gateway:
    image: nginx:1.27-alpine
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    depends_on:
      - frontend
      - backend
      - ai-service

volumes:
  pgdata:
